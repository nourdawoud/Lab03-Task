
name: Two Job Workflow

on:
  push:
  pull_request:

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: First job
        run: echo "First job succeeded!"

  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Second job
        run: echo "Second job runs after the first job succeeds!"
